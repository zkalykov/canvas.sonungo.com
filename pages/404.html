<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Canvas Reminder Bot</title>
    <link rel="icon" type="image/png" href="/media/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search);
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        background: '#0a0a0a',
                    }
                }
            }
        }
    </script>
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts for Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f10;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        body::-webkit-scrollbar {
            display: none;
        }
        
        /* Full Page Redish Gradient */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(80, 20, 20, 0.5) 0%, rgba(15, 15, 16, 0) 60%),
                radial-gradient(circle at 90% 10%, rgba(100, 0, 0, 0.3) 0%, rgba(15, 15, 16, 0) 50%),
                radial-gradient(circle at 50% 50%, rgba(50, 10, 10, 0.2) 0%, rgba(15, 15, 16, 1) 100%),
                radial-gradient(circle at 80% 80%, rgba(60, 20, 20, 0.3) 0%, rgba(15, 15, 16, 0) 50%);
            z-index: 0;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">
    
    <div class="gradient-bg"></div>

    <main class="relative z-10 w-full flex-grow flex items-center justify-center">
        <!-- Hero Section -->
        <section class="max-w-7xl px-6 py-12 flex flex-col items-center justify-center text-center">
            
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 border border-red-500/20 backdrop-blur-sm mb-6">
                <span class="text-sm font-medium text-red-400 tracking-wide">Error 404</span>
            </div>
            
            <h1 class="text-5xl sm:text-6xl md:text-8xl font-bold tracking-tight text-white/90 drop-shadow-2xl mb-6">
                Page not found
            </h1>
            
            <p class="text-lg text-gray-400 max-w-lg mx-auto mb-10">
                Sorry, we couldn't find the page you're looking for. It might have been moved or doesn't exist.
            </p>

            <a href="/" class="inline-flex items-center gap-2 px-8 py-3.5 rounded-full bg-white text-black font-medium hover:bg-gray-200 transition-colors text-lg shadow-lg shadow-white/5">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Go back home
            </a>

        </section>

        <!-- Footer -->
        <footer class="absolute bottom-0 w-full py-8 text-center text-gray-500 font-light text-sm">
            <p>© Canvas Reminder Bot. Built by <a href="https://zhyrgalbek.me" class="hover:text-white transition-colors">zhyrgalbek.me</a>.</p>
        </footer>
    </main>
</body>
</html>
